# Shared, caller-only implementation for the fixed Sync from template workflow in every instance repository.
# `actions/checkout` operates on the calling instance repository when invoked from this workflow.
name: Shared template sync (caller only)

on:
  workflow_call:
    inputs:
      template_ref:
        description: Template branch or ref to fetch and merge.
        required: false
        type: string
        default: main
    secrets:
      instance_token:
        description: Optional GitHub fine-grained PAT used only when the sync changes workflow files.
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write job purpose summary
        shell: bash
        run: |
          {
            echo "## Job purpose"
            echo
            echo "This job synchronizes the instance from the fixed Panopticon template."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate template ref
        shell: bash
        env:
          TEMPLATE_REF: ${{ inputs.template_ref }}
        run: |
          set -euo pipefail
          if [ -z "${TEMPLATE_REF//[[:space:]]/}" ]; then
            {
              echo "## Panopticon: invalid template ref"
              echo
              echo "Selected template ref is empty. Set \`template_ref\` to a named template branch or ref, or omit it to use \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::template_ref must be a non-empty named template branch or ref; see the step summary"
            exit 1
          fi
          echo "PANOPTICON_TEMPLATE_REF=$TEMPLATE_REF" >> "$GITHUB_ENV"

      - name: Prepare local recovery instructions
        if: always()
        shell: python
        env:
          TEMPLATE_REF: ${{ inputs.template_ref }}
        run: |
          import os
          import shlex
          from pathlib import Path

          template_ref = os.environ["TEMPLATE_REF"]
          fetch_ref = shlex.quote(template_ref)
          merge_ref = shlex.quote(f"template/{template_ref}")
          recovery = f"""## Panopticon: recover this template sync locally

The shared template sync failed before it could push. From a local clone of this instance
repository, run the following commands. They use the same fixed template source, selected
template ref, and protected-path setup as the shared workflow.

Selected template ref: `{template_ref}`

```bash
git remote add template https://github.com/industrial-curiosity/panopticon-ay-eye.git 2>/dev/null || git remote set-url template https://github.com/industrial-curiosity/panopticon-ay-eye.git
git fetch template {fetch_ref}
git config merge.ours.driver true
python3 - <<'PY'
from pathlib import Path
import sys

sys.path.insert(0, ".")
from panopticon.config import derive_protected_paths, load_org_config

paths = derive_protected_paths(load_org_config("."))
attributes = Path(".git/info/attributes")
attributes.parent.mkdir(parents=True, exist_ok=True)
attributes.write_text("".join(f"{{path}} merge=ours" + chr(10) for path in paths), encoding="utf-8")
PY
if git merge-base HEAD {merge_ref} >/dev/null 2>&1; then
  git merge {merge_ref} --no-edit
else
  git merge {merge_ref} --no-edit --allow-unrelated-histories -X theirs
fi
# If Git reports conflicts, resolve them, then run:
git add -A
git commit -m "chore: sync from template"
git push origin HEAD
```

Review `git status` and `git diff` before committing. If the failed sync changed a workflow
file, configure the `PANOPTICON_INSTANCE_TOKEN` Actions secret with a GitHub fine-grained
PAT that has Contents and Workflows read/write access, then retry.
"""
          Path(os.environ["RUNNER_TEMP"], "panopticon-template-sync-recovery.md").write_text(
              recovery, encoding="utf-8"
          )

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # A PAT is required only when this sync pushes workflow-file changes. The fallback keeps
          # ordinary template updates usable before an instance has configured that optional secret.
          token: ${{ secrets.instance_token || github.token }}

      - name: Record template-sync authentication
        shell: bash
        env:
          INSTANCE_TOKEN: ${{ secrets.instance_token }}
        run: |
          set -euo pipefail
          echo "PANOPTICON_SYNC_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -n "${INSTANCE_TOKEN:-}" ]; then
            echo "Template sync is using the configured GitHub-token secret." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Template sync is using the default GitHub token for this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch template
        shell: bash
        run: |
          set -euo pipefail
          git remote add template https://github.com/industrial-curiosity/panopticon-ay-eye.git 2>/dev/null || true
          if ! fetch_output="$(git fetch template "$PANOPTICON_TEMPLATE_REF" 2>&1)"; then
            {
              echo "## Panopticon: template fetch failed"
              echo
              echo "Selected template ref: \`$PANOPTICON_TEMPLATE_REF\`"
              echo
              printf '%s\n' "${fetch_output}"
              echo
              echo "Verify access to the fixed template repository, then rerun **Sync from template**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Template fetch failed; see the step summary"
            exit 1
          fi

      - name: Register protected-config merge driver
        run: git config merge.ours.driver true

      - name: Register generated and org-declared protected paths
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from panopticon.config import (
              derive_protected_path_groups,
              derive_protected_paths,
              load_org_config,
          )

          try:
              org_config = load_org_config(".")
              groups = derive_protected_path_groups(org_config)
              generated_paths = groups["generated"]
              provider_paths = groups["provider"]
              protected_paths = groups["organization"]
              attributed_paths = derive_protected_paths(org_config)

              attrs_path = Path(".git/info/attributes")
              attrs_path.parent.mkdir(parents=True, exist_ok=True)
              attrs_path.write_text(
                  "".join(f"{path} merge=ours\n" for path in attributed_paths), encoding="utf-8"
              )
          except Exception as exc:
              reason = f"Protected-path registration failed: {exc}"
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(f"## Panopticon: protected-path registration failed\n\n{reason}\n\n")
                  handle.write(f"Selected template ref: `{os.environ['PANOPTICON_TEMPLATE_REF']}`\n\n")
                  handle.write("Correct the instance configuration, then rerun **Sync from template**.\n")
              print(f"::error::{reason}; see the step summary")
              raise SystemExit(1)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Template-declared instance-owned generated paths\n\n")
              handle.write(
                  "These generated paths keep the instance version when both sides change; "
                  "they are not org customizations:\n\n"
              )
              for path in generated_paths:
                  handle.write(f"- `{path}` — template-generated output rebuilt by Panopticon merge tooling.\n")

              handle.write("\n## Provider-derived protected paths\n\n")
              if provider_paths:
                  handle.write(
                      "The trusted provider contract automatically protects these "
                      "instance-owned paths:\n\n"
                  )
                  for path in provider_paths:
                      handle.write(f"- `{path}` — provider-derived protection from the trusted provider contract.\n")
              else:
                  handle.write("No trusted provider-derived paths declared for this instance.\n")

              handle.write("\n## Org-declared protected paths\n\n")
              if protected_paths:
                  handle.write(
                      "The following `protected_paths` entries were protected from this sync "
                      "(never visible in the tracked tree — this step summary is the audit trail):\n\n"
                  )
                  for path in protected_paths:
                      handle.write(f"- `{path}` — organization-declared customization; maintain its debt record.\n")
              else:
                  handle.write("No `protected_paths` entries declared in `panopticon.config.json`.\n")

      - name: Merge template changes
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base HEAD "template/$PANOPTICON_TEMPLATE_REF" > /dev/null 2>&1; then
            merge_args=("template/$PANOPTICON_TEMPLATE_REF" --no-edit)
          else
            echo "No common ancestor detected — first-time sync. Template version wins for any conflicts."
            merge_args=("template/$PANOPTICON_TEMPLATE_REF" --no-edit --allow-unrelated-histories -X theirs)
          fi
          if ! merge_output="$(git merge "${merge_args[@]}" 2>&1)"; then
            {
              echo "## Panopticon: template merge failed"
              echo
              echo "Selected template ref: \`$PANOPTICON_TEMPLATE_REF\`"
              echo
              printf '%s\n' "${merge_output}"
              echo
              echo "Resolve the reported conflict locally using the recovery commands below, then rerun **Sync from template**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Template merge failed; see the step summary"
            exit 1
          fi

      - name: Summarize template changes
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$(git diff --name-only "$PANOPTICON_SYNC_START_SHA" HEAD)"
          {
            echo "## Panopticon: template sync"
            echo
            echo "Selected template ref: \`$PANOPTICON_TEMPLATE_REF\`"
            echo
            echo "### Changed paths"
            echo
            if [ -n "$changed_paths" ]; then
              while IFS= read -r path; do
                [ -n "$path" ] && printf -- '- `%s`\n' "$path"
              done <<< "$changed_paths"
            else
              echo "No paths changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn on protected-config field drift
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          sys.path.insert(0, ".")
          from panopticon.config import PROTECTED_CONFIG_FILES

          for path in PROTECTED_CONFIG_FILES:
              incoming = subprocess.run(
                  ["git", "show", f"template/{os.environ['PANOPTICON_TEMPLATE_REF']}:{path}"],
                  capture_output=True,
                  text=True,
              )
              if incoming.returncode != 0:
                  continue
              try:
                  incoming_fields = set(json.loads(incoming.stdout))
              except json.JSONDecodeError:
                  print(f"::warning::{path}: incoming template version is not valid JSON; skipping field-diff check")
                  continue
              try:
                  with open(path, encoding="utf-8") as handle:
                      current_fields = set(json.load(handle))
              except FileNotFoundError:
                  continue
              added = sorted(incoming_fields - current_fields)
              removed = sorted(current_fields - incoming_fields)
              if added:
                  print(f"::warning::{path}: the template added field(s) {added} not present in your copy")
              if removed:
                  print(f"::warning::{path}: the template removed field(s) {removed} still present in your copy")

      - name: Validate token before pushing workflow changes
        shell: bash
        env:
          INSTANCE_TOKEN: ${{ secrets.instance_token }}
        run: |
          set -euo pipefail
          if git diff --quiet "$PANOPTICON_SYNC_START_SHA" HEAD -- .github/workflows; then
            exit 0
          fi
          if [ -n "${INSTANCE_TOKEN:-}" ]; then
            exit 0
          fi
          {
            echo "## Panopticon: GitHub token required for workflow updates"
            echo
            echo "Selected template ref: \`$PANOPTICON_TEMPLATE_REF\`"
            echo
            echo "This template sync changed a file under `.github/workflows/`."
            echo "The default GitHub token cannot push workflow-file changes."
            echo
            echo "Create the organization or repository Actions secret `PANOPTICON_INSTANCE_TOKEN`"
            echo "with a GitHub fine-grained PAT that has Contents and Workflows read/write access"
            echo "to this instance repository, then rerun **Sync from template**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Workflow updates require the PANOPTICON_INSTANCE_TOKEN GitHub-token secret; see the step summary"
          exit 1

      - name: Push
        shell: bash
        run: |
          set -euo pipefail
          if ! push_output="$(git push origin HEAD 2>&1)"; then
            {
              echo "## Panopticon: template sync push failed"
              echo
              echo "Selected template ref: \`$PANOPTICON_TEMPLATE_REF\`"
              echo
              printf '%s\n' "${push_output}"
              echo
              echo "Verify the instance token and branch permissions, then rerun **Sync from template**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Template sync push failed; see the step summary"
            exit 1
          fi

      - name: Write local recovery instructions
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/panopticon-template-sync-recovery.md" >> "$GITHUB_STEP_SUMMARY"
